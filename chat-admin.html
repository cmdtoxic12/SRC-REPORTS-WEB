<!doctype html>
<html lang="en">
  <head>
    <title>Admin Chat Inbox</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/png"
      href="https://files.catbox.moe/ta4pt5.png"
    />
  </head>
  <body>
     <nav class="navbar">

    <div class="logo">
       <a href="index.html" class="logo">
        <img
          src="https://files.catbox.moe/ta4pt5.png"
          alt="EP College of Education Logo"
        />
        <div class="logo-text">
          <h2>ConcernHub</h2>
          <small>EP College of Education, Amedzofe</small>
        </div>
    </div>

    <button type="button" id="menuBtn" class="menu-btn">
    <i class="fas fa-bars"></i>
</button>

    <ul id="navLinks" class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="submit.html">Submit</a></li>
        <li><a href="reports.html">Reports</a></li>
        <li><a href="track.html">Track</a></li>
      <li><button onclick="logout()" class="logout-btn">Logout</button></li>
    </ul>

</nav>

      <a href="admin.html">Dashboard</a>
      <button onclick="logout()">Logout</button>
    </nav>

    <div class="container">
      <h1>Live Chat Inbox</h1>

      <div class="chat-admin-layout">
        <div class="chat-users" id="chatUsers"></div>

        <div class="chat-panel">
          <div id="selectedChatTitle" class="chat-panel-title">
            Select a conversation
          </div>

          <div
            class="chat-messages admin-chat-messages"
            id="adminChatMessages"
          ></div>

          <div class="chat-input">
            <input id="adminChatInput" placeholder="Type admin reply..." />
            <button onclick="sendAdminReply()">Send</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="auth-check.js"></script>
    <script src="chat-admin.js"></script>
    <script src="navbar.js"></script>
  </body>
</html>
