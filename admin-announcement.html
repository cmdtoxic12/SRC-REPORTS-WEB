<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
        <nav class="navbar">

    <div class="logo">
       <a href="index.html" class="logo">
        <img
          src="https://files.catbox.moe/ta4pt5.png"
          alt="EP College of Education Logo"
        />
        <div class="logo-text">
          <h2>ConcernHub</h2>
          <small>EP College of Education, Amedzofe</small>
        </div>
    </div>

    <button type="button" id="menuBtn" class="menu-btn">
    <i class="fas fa-bars"></i>
</button>

    <ul id="navLinks" class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="reports.html">Reports</a></li>
    </ul>

        </nav>
    
    <div class="card dash-card">
      <h2>Create Announcement</h2>

      <input
        type="text"
        id="announcementTitle"
        placeholder="Announcement title"
      />

      <select id="announcementCategory">
        <option>General</option>
        <option>Academic</option>
        <option>Exams</option>
        <option>Events</option>
        <option>Emergency</option>
      </select>

      <textarea
        id="announcementContent"
        placeholder="Write announcement..."
      ></textarea>

      <input type="file" id="announcementFile" accept="image/*,.pdf" />

      <div class="pin-checkbox">
        <input type="checkbox" id="announcementPinned" />

        <label for="announcementPinned"> Pin announcement </label>
      </div>

      <button onclick="publishAnnouncement()">Publish Announcement</button>
    </div>

    <div id="announcementList">Loading announcements...</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="announcement.js"></script>
  </body>
</html>
