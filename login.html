<!doctype html>
<html lang="en">
  <head>
    <title>Admin Login</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/png"
      href="https://files.catbox.moe/ta4pt5.png"
    />
  </head>
  <body>
    <nav>
      <a href="index.html" class="logo">
        <img
          src="https://files.catbox.moe/ta4pt5.png"
          alt="EP College of Education Logo"
        />
        <div class="logo-text">
          <h2>ConcernHub</h2>
          <small>EP College of Education, Amedzofe</small>
        </div>
      </a>
      <a href="index.html">Home</a>
      <a href="reports.html">Reports</a>
    </nav>

    <div class="container">
      <form id="loginForm">
        <h1>Admin Login</h1>

        <input id="email" type="email" placeholder="Admin email" required />
        <input id="password" type="password" placeholder="Password" required />

        <button type="submit">Login</button>

        <button type="button" onclick="loginWithGoogle()">
          Continue with Google
        </button>

        <p>
          <a href="#" onclick="forgotPassword()">I've forgotten password</a>
        </p>

        <p id="message"></p>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="login.js"></script>
    <script src="animations.js"></script>
  </body>
</html>
