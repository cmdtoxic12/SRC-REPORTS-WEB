<!doctype html>
<html lang="en">
  <head>
    <title>Admin Login</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/png"
      href="https://files.catbox.moe/ta4pt5.png"
    />
  </head>
  <body>
    <nav class="navbar">

    <div class="logo">
       <a href="index.html" class="logo">
        <img
          src="https://files.catbox.moe/ta4pt5.png"
          alt="EP College of Education Logo"
        />
        <div class="logo-text">
          <h2>ConcernHub</h2>
          <small>EP College of Education, Amedzofe</small>
        </div>
    </div>

    <button type="button" id="menuBtn" class="menu-btn">
    <i class="fas fa-bars"></i>
</button>

    <ul id="navLinks" class="nav-links">
        <li><a href="index.html">Home</a></li>
    </ul>

</nav>

    <div class="container">
      <form id="loginForm">
        <h1>Admin Login</h1>

        <input id="email" type="email" placeholder="Admin email" required />
        <input id="password" type="password" placeholder="Password" required />

        <button type="submit">Login</button>

        <button type="button" onclick="loginWithGoogle()">
          Continue with Google
        </button>

        <p>
          <a href="#" onclick="forgotPassword()">I've forgotten password</a>
        </p>

        <p id="message"></p>
      </form>
    </div>

    <div class="chat-float" id="chatFloat">
      <button class="chat-toggle" onclick="toggleChat()">💬</button>

      <div class="chat-box" id="chatBox">
        <div class="chat-header">
          <div>
            <strong>ConcernHub Support</strong>
            <small>Online</small>
          </div>
          <button onclick="toggleChat()">×</button>
        </div>

        <div class="chat-messages" id="chatMessages">
          <div class="bot-msg">Hi 👋 How can we help you?</div>
        </div>

        <div class="chat-input">
          <input id="chatInput" placeholder="Type your message..." />
          <button onclick="sendChat()">Send</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="login.js"></script>
    <script src="navbar.js"></script>
    <script src="animations.js"></script>
    <script src="chat.js"></script>
  </body>
</html>
