<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/png"
      href="https://files.catbox.moe/ta4pt5.png"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <nav class="navbar">

    <div class="logo">
       <a href="index.html" class="logo">
        <img
          src="https://files.catbox.moe/ta4pt5.png"
          alt="EP College of Education Logo"
        />
        <div class="logo-text">
          <h2>ConcernHub</h2>
          <small>EP College of Education, Amedzofe</small>
        </div>
    </div>

    <button type="button" id="menuBtn" class="menu-btn">
    <i class="fas fa-bars"></i>
</button>

    <ul id="navLinks" class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="submit.html">Submit</a></li>
        <li><a href="reports.html">Reports</a></li>
        <li><a href="track.html">Track</a></li>
      <li><button onclick="logout()" class="logout-btn">Logout</button></li>
    </ul>

</nav>

    <div class="container">
      <h1>Admin Dashboard</h1>

      <div class="dashboard-stats">
        <div class="dash-card blue">
          <h1 id="totalReports">0</h1>
          <p>Total Reports</p>
        </div>

        <div class="dash-card yellow">
          <h1 id="pendingReports">0</h1>
          <p>Pending</p>
        </div>

        <div class="dash-card green">
          <h1 id="resolvedReports">0</h1>
          <p>Resolved</p>
        </div>

        <div class="dash-card red">
          <h1 id="rejectedReports">0</h1>
          <p>Rejected</p>
        </div>
      </div>

      <input
        id="searchInput"
        placeholder="Search title, description, name..."
      />

      <div class="filters">
        <select id="typeFilter">
          <option value="">All Types</option>
          <option>Issue</option>
          <option>Idea</option>
          <option>Suggestion</option>
          <option>Complaint</option>
        </select>

        <select id="statusFilter">
          <option value="">All Status</option>
          <option>Pending</option>
          <option>In Review</option>
          <option>Resolved</option>
          <option>Rejected</option>
        </select>

        <select id="sortFilter">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="pending">Pending First</option>
          <option value="resolved">Resolved First</option>
          <option value="recentReply">Most Recent Reply</option>
        </select>
      </div>

      <div class="export-buttons">
        <button onclick="exportCSV()">Export CSV</button>
        <button onclick="exportExcel()">Export Excel</button>
        <button onclick="exportPDF()">Export PDF</button>
      </div>

      <div id="adminList"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="auth-check.js"></script>
    <script src="admin.js"></script>
    <script src="navbar.js"></script>
    <script src="animations.js"></script>
    <script src="chat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
    <script src="announcement.js"></script>
  </body>
</html>
