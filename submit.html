<!doctype html>
<html lang="en">
  <head>
    <title>Submit Concern</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/png"
      href="https://files.catbox.moe/ta4pt5.png"
    />
  </head>
  <body>
    <nav>
      <a href="index.html" class="logo">
        <img
          src="https://files.catbox.moe/ta4pt5.png"
          alt="EP College of Education Logo"
        />
        <div class="logo-text">
          <h2>ConcernHub</h2>
          <small>EP College of Education, Amedzofe</small>
        </div>
      </a>
      <a href="index.html">Home</a>
      <a href="submit.html">Submit</a>
      <a href="reports.html">Reports</a>
    </nav>

    <div class="container">
      <h1>Submit Issue or Idea</h1>

      <form id="reportForm">
        <input id="name" placeholder="Your name" />
        <input id="email" type="email" placeholder="Your email" />

        <select id="type" required>
          <option value="">Select Type</option>
          <option value="Issue">Issue</option>
          <option value="Idea">Idea</option>
          <option value="Suggestion">Suggestion</option>
          <option value="Complaint">Complaint</option>
        </select>

        <input
          id="category"
          placeholder="Category e.g. School, Website, Community"
        />
        <input id="title" placeholder="Title" required />
        <textarea
          id="description"
          placeholder="Describe your concern..."
          required
        ></textarea>

        <label>Supporting Attachments (Optional)</label>

<input
    type="file"
    id="attachments"
    multiple
    accept="
      image/*,
      application/pdf,
      video/*,
      .doc,
      .docx,
      .xls,
      .xlsx,
      .ppt,
      .pptx
    ">

<div id="attachmentPreview"></div>

 <button type="submit" class="submit-btn">
        Submit Report
    </button>
<div id="message"></div>
      </form>

      <div id="confirmationMessage" class="confirmation-message"></div>

    <div class="chat-float" id="chatFloat">
      <button class="chat-toggle" onclick="toggleChat()">💬</button>

      <div class="chat-box" id="chatBox">
        <div class="chat-header">
          <div>
            <strong>ConcernHub Support</strong>
            <small>Online</small>
          </div>
          <button onclick="toggleChat()">×</button>
        </div>

        <div class="chat-messages" id="chatMessages">
          <div class="bot-msg">Hi 👋 How can we help you?</div>
        </div>

        <div class="chat-input">
          <input id="chatInput" placeholder="Type your message..." />
          <button onclick="sendChat()">Send</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="submit.js"></script>
    <script src="animations.js"></script>
    <script src="chat.js"></script>
  </body>
</html>
